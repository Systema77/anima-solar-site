<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANIMA APP — in sviluppo</title>
<meta name="description" content="ANIMA APP è in sviluppo. Il gioco, ANIMA GAME, è già vivo su animagame.io.">
<!-- 2026-08-19 — DECISIONE DEL DIRETTORE: questo dominio è una LANDING, non un ponte.
     Prima era un ponte con redirect automatico verso animagame.io: il redirect è
     TOLTO (meta refresh, canonical e location.replace), altrimenti la landing non si
     vede nemmeno. Resta un link al gioco, perché chi arriva qui cercando ANIMA GAME
     non deve finire in un vicolo cieco — era il rilievo di D.R.A.G.O. del 06/08.
     ⛔ Volutamente NON contiene: date d'uscita, la regola dell'invito, i conti di
     crescita. Sono un altro cantiere, e il Direttore ha detto di non aprirlo.
     ⛔ Nessun nome di persona: cinque repo pubblici e zero nomi veri, e resta così.
     — SQUELCH -->
<style>
  :root{
    --bg-deep:#0C0B0E; --amber:#C9A15E; --verde:#38E08A;
    --text-hi:#ECE7DF; --text-lo:#A7A29B; --line:#3A3730;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg-deep); color:var(--text-hi);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:2rem;
    background-image:radial-gradient(ellipse at 50% 38%, rgba(201,161,94,.07), transparent 62%);
  }
  main{max-width:36rem}
  .marca{
    font-family:"Courier Prime","Courier New",monospace;
    letter-spacing:.35em; font-size:.85rem; color:var(--amber);
    text-transform:uppercase; margin-bottom:1.4rem;
  }
  h1{font-size:clamp(1.7rem,5vw,2.5rem); font-weight:400; letter-spacing:.03em; line-height:1.35; margin-bottom:1rem}
  h1 b{color:var(--amber); font-weight:400}
  .riga{width:3.5rem; height:1px; background:var(--line); margin:1.5rem auto}
  p{color:var(--text-lo); line-height:1.7; font-size:1.02rem}
  p + p{margin-top:1rem}
  .porta{
    display:inline-block; margin-top:2rem; padding:.7rem 1.5rem;
    border:1px solid var(--verde); border-radius:2px;
    font-family:"Courier Prime","Courier New",monospace;
    font-size:.85rem; letter-spacing:.2em; color:var(--verde); text-decoration:none;
  }
  .porta:hover{background:rgba(56,224,138,.08)}
  footer{
    position:fixed; left:0; right:0; bottom:1.2rem;
    font-family:"Courier Prime","Courier New",monospace;
    font-size:.72rem; letter-spacing:.1em; color:var(--text-lo); text-align:center;
  }
  footer a{color:var(--text-lo); text-decoration:none; border-bottom:1px solid var(--line)}
  footer a:hover{color:var(--amber)}
  footer .sep{margin:0 .5rem; color:var(--line)}
  /* Su telefono il footer smette di essere fisso, altrimenti copre il testo.
     ⚠️ Ma `body` e' flex: togliendogli `position:fixed` il footer diventa una
     COLONNA accanto a main e si accavalla al titolo. Visto nel browser, non
     dedotto — serve anche `flex-direction:column`. */
  @media (max-width:520px){
    body{flex-direction:column; align-items:center; justify-content:flex-start; padding-top:3.5rem}
    footer{position:static; margin-top:3rem}
  }
</style>
</head>
<body>
<main>
  <div class="marca">&#9673; Anima App</div>
  <h1>È <b>in sviluppo</b>.</h1>
  <div class="riga"></div>
  <p>Ci stiamo lavorando con calma. Quando ci sarà qualcosa da vedere, lo trovi qui.</p>
  <p>Nel frattempo il gioco è già vivo: si chiama <b>ANIMA GAME</b> e si entra da animagame.io.</p>
  <a class="porta" href="https://animagame.io/">&gt; vai al gioco</a>
</main>
<footer>
  <a href="https://systema77.com">systema77.com — la casa</a><span class="sep">·</span><a href="https://cyberboomer.ninja">cyberboomer.ninja — la voce</a>
</footer>
</body>
</html>
